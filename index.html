

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8dce8">
<title>Roleplay Club</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5dce8;color:#493744}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
.phone{min-height:100vh;max-width:480px;margin:auto;background:linear-gradient(145deg,#fce8f0,#e9c9dc);position:relative;overflow:hidden}
.status{height:35px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.screen{padding:24px 22px 35px;min-height:calc(100vh - 35px)}
.lock{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#fff5fa,#e9c4d8 75%)}
.lock .date{font-size:17px;color:#805b73}
.clock{font-size:76px;font-weight:200;letter-spacing:-4px;margin:5px 0 30px}
.lock h1{font-size:27px;font-weight:600}
.lock p{color:#805b73}
.unlock{background:#fff7fb;color:#895b78;border-radius:30px;padding:14px 28px;margin-top:45px;box-shadow:0 5px 18px #b7839d44}
.home{display:none}
.greeting{font-size:25px;font-weight:650;margin:18px 0 5px}
.subtitle{color:#926e83;font-size:13px;margin-bottom:25px}
.widget{background:#ffffffa8;border:1px solid #fff9;border-radius:22px;padding:17px;margin-bottom:25px;box-shadow:0 8px 25px #b7839d20}
.widget strong{font-size:14px}
.widget p{font-size:13px;color:#88677c;margin:7px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;color:#513e4c;font-size:11px}
.app-icon{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#fff,#f4d3e3);display:grid;place-items:center;font-size:27px;box-shadow:0 5px 13px #9d6d8933}
.dock{position:sticky;bottom:14px;margin:35px 0 0;padding:13px;background:#ffffff80;border:1px solid #fff9;border-radius:25px;display:flex;justify-content:space-around;backdrop-filter:blur(15px)}
.dock button{background:none;font-size:27px}
.panel{display:none;position:absolute;inset:35px 0 0;background:#fff8fc;padding:18px;overflow:auto;border-radius:25px 25px 0 0}
.panel h2{margin:8px 0 16px}
.back{background:#f3dce8;color:#805b73;padding:9px 15px;border-radius:20px;margin-bottom:12px}
.item{padding:14px;background:#fff;border-radius:17px;margin:9px 0;box-shadow:0 3px 12px #9d6d8910}
.item small{display:block;color:#997b8d;margin-top:5px}
.chat{display:flex;gap:10px;align-items:center}
.avatar{width:43px;height:43px;flex-shrink:0;border-radius:50%;background:#f4d9e7;display:grid;place-items:center;font-size:21px}
.note{font-size:13px;color:#96778a;line-height:1.5}
.action{background:#f5e4ed;color:#805b73;border-radius:15px;padding:10px 12px;margin:3px;font-size:13px}
.primary{background:#e9c4d8;color:#583b4e;border-radius:18px;padding:12px 15px}
.field{width:100%;border:1px solid #e6c5d7;border-radius:15px;padding:12px;background:white;color:#493744;margin:6px 0}
.message{max-width:88%;padding:12px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.message:active{transform:scale(0.99)}
.mine{align-self:flex-end;background:#f2d5e3}
.theirs{align-self:flex-start;background:white}
#chatMessages{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.composer{display:flex;gap:7px;position:sticky;bottom:0;background:#fff8fc;padding:10px 0}
.composer input{min-width:0;flex:1;border:1px solid #e6c5d7;border-radius:22px;padding:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.catalog-search{margin:12px 0}
.category-list{display:flex;gap:7px;overflow-x:auto;padding:5px 0 12px;scrollbar-width:none}
.category-list button{white-space:nowrap;border-radius:20px;padding:9px 13px;background:#f5e4ed;color:#805b73;font-size:12px}
.category-list button.active{background:#e9c4d8;color:#583b4e;font-weight:700}
.character-card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #9d6d8910}
.character-top{display:flex;align-items:center;gap:12px}
.character-avatar{width:54px;height:54px;border-radius:18px;background:#f5e4ed;display:grid;place-items:center;font-size:27px;flex-shrink:0;overflow:hidden}
.character-avatar img{width:100%;height:100%;object-fit:cover}
.character-info{flex:1;min-width:0}
.character-info strong{display:block}
.character-info small{display:block;color:#997b8d;margin-top:4px}
.favorite{background:#fff0f5;color:#a45b7d;border-radius:14px;padding:9px;font-size:18px}
.character-actions{display:flex;gap:7px;margin-top:12px}
.character-actions button{flex:1}
.empty{text-align:center;padding:24px 12px;color:#96778a;font-size:13px}
.anilist-box{background:#fff0f6;border:1px solid #f0d4e2;border-radius:20px;padding:14px;margin:14px 0}
.anilist-box h3{margin:3px 0 7px}
.anilist-box .primary{width:100%;margin-top:7px}
.anilist-result{display:flex;gap:11px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin:9px 0}
.anilist-result img{width:62px;height:78px;object-fit:cover;border-radius:11px;background:#f5e4ed;flex-shrink:0}
.anilist-result-info{flex:1;min-width:0}
.anilist-result-info strong{display:block;font-size:14px}
.anilist-result-info small{display:block;color:#997b8d;margin-top:4px;font-size:12px}
.anilist-result button{background:#f5e4ed;color:#805b73;border-radius:12px;padding:9px;font-size:12px}
.anilist-status{font-size:13px;color:#805b73;margin:10px 2px;line-height:1.5}
.catalog-source-box{background:#fff0f6;border:1px solid #f0d4e2;border-radius:20px;padding:14px;margin:14px 0}
.catalog-source-box h3{margin:3px 0 7px}
.catalog-source-box .primary{width:100%;margin-top:7px}
.catalog-source-result{display:flex;gap:10px;align-items:center;background:#fff;border-radius:15px;padding:11px;margin:8px 0}
.catalog-source-result img{width:55px;height:70px;object-fit:cover;border-radius:10px;flex-shrink:0}
.catalog-source-result-info{flex:1;min-width:0}
.catalog-source-result-info strong{display:block}
.catalog-source-result-info small{display:block;color:#997b8d;margin-top:4px}
.catalog-source-result button{background:#f5e4ed;color:#805b73;border-radius:12px;padding:9px;font-size:12px}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span id="statusTime">09:41</span><span>●●● Wi-Fi ▰</span></div>

<section class="screen lock" id="lock">
<div class="date" id="date"></div>
<div class="clock" id="clock">09:41</div>
<h1>Roleplay Club</h1>
<p>Твой маленький виртуальный мир ♡</p>
<button class="unlock" onclick="unlock()">Разблокировать →</button>
</section>

<section class="screen home" id="home">
<div class="greeting">Привет, дорогая ♡</div>
<div class="subtitle">Добро пожаловать в твой мир</div>
<div class="widget"><strong>✧ ТВОЁ ПРОСТРАНСТВО</strong><p>Здесь начинаются истории, знакомства и приключения.</p></div>
<div class="grid">
<button class="app" onclick="openApp('chats')"><span class="app-icon">💬</span>Сообщения</button>
<button class="app" onclick="openApp('characters')"><span class="app-icon">🎭</span>Персонажи</button>
<button class="app" onclick="openApp('social')"><span class="app-icon">📸</span>Pinkstagram</button>
<button class="app" onclick="openApp('gallery')"><span class="app-icon">🌷</span>Галерея</button>
<button class="app" onclick="openApp('music')"><span class="app-icon">🎧</span>Melody</button>
<button class="app" onclick="openApp('diary')"><span class="app-icon">📔</span>Дневник</button>
<button class="app" onclick="openApp('contacts')"><span class="app-icon">👥</span>Контакты</button>
<button class="app" onclick="openApp('settings')"><span class="app-icon">⚙️</span>Настройки</button>
</div>
<div class="dock">
<button onclick="openApp('chats')">💬</button>
<button onclick="openApp('social')">📸</button>
<button onclick="openApp('gallery')">🖼️</button>
<button onclick="openApp('settings')">⚙️</button>
</div>
</section>

<section class="panel" id="panel">
<button class="back" onclick="closeApp()">← На главный экран</button>
<div id="panelContent"></div>
</section>
</div>

<script>
const categories=[
"Все","Избранное","Визуальные новеллы","Игры",
"Аниме и манга","Фильмы и сериалы","Книги","Оригинальные"
];

const characters=[
["Натаниэль Говард","Тени Сентфора 2","🖤","Визуальные новеллы"],
["Надин","Тени Сентфора 2","🌹","Визуальные новеллы"],
["Декс","Тени Сентфора 2","⭐","Визуальные новеллы"],
["Руди","Тени Сентфора 2","🌙","Визуальные новеллы"],
["BB","Big Bad Dogs","🐾","Визуальные новеллы"]
];

let favorites=[];
let catalogCategory="Все";
let catalogSearch="";
let anilistResults=[];
let catalogSourceResults={wikidata:[],vndb:[]};

try{
const savedCharacters=JSON.parse(localStorage.getItem("roleplay_custom_characters")||"[]");
if(Array.isArray(savedCharacters)){
savedCharacters.forEach(c=>{
if(Array.isArray(c)&&c.length>=4)characters.push(c);
});
}
}catch(e){}

try{
const savedFavorites=JSON.parse(localStorage.getItem("roleplay_favorites")||"[]");
if(Array.isArray(savedFavorites))favorites=savedFavorites;
}catch(e){}

function characterKey(c){return c[0]+"|||"+c[1]}

function saveCharacters(){
localStorage.setItem("roleplay_custom_characters",JSON.stringify(characters.slice(5)));
}

function saveFavorites(){
localStorage.setItem("roleplay_favorites",JSON.stringify(favorites));
}

function updateTime(){
const now=new Date();
const time=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
document.getElementById('clock').textContent=time;
document.getElementById('date').textContent=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('statusTime').textContent=time;
}
updateTime();
setInterval(updateTime,10000);

function unlock(){
document.getElementById('lock').style.display='none';
document.getElementById('home').style.display='block';
}
function closeApp(){
document.getElementById("panel").style.display="none";
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);
}

let chats=[];
let activeChatId=null;
let busy=false;
let selectedMessageIndex=null;
let messagePressTimer=null;

try{
chats=JSON.parse(localStorage.getItem("roleplay_conversations")||"[]");
if(!Array.isArray(chats))chats=[];
}catch(e){chats=[];}

function saveChats(){
localStorage.setItem("roleplay_conversations",JSON.stringify(chats));
}

function makeId(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/* Перенос старых переписок */
try{
const old=JSON.parse(localStorage.getItem("roleplay_chats")||"{}");
for(const name in old){
if(Array.isArray(old[name])&&!chats.some(c=>c.title===name)){
chats.push({id:makeId(),title:name,type:"private",participants:[name],messages:old[name],memory:""});
}
}
saveChats();
}catch(e){}

function getChat(){
return chats.find(c=>c.id===activeChatId);
}

function openApp(name){
const content=document.getElementById("panelContent");
const panel=document.getElementById("panel");
const titles={
chats:"Сообщения 💬",characters:"Персонажи 🎭",
social:"Pinkstagram 📸",gallery:"Галерея 🌷",
music:"Melody 🎧",diary:"Дневник 📔",
contacts:"Контакты 👥",settings:"Настройки ⚙️"
};
let html="<h2>"+titles[name]+"</h2>";

if(name==="chats"){
html+=`<button class="primary" onclick="chooseNewChat()">＋ Новый чат</button>
<div class="row" style="margin-top:14px">
<button class="action" onclick="chooseNewChat()">Личный чат</button>
<button class="action" onclick="chooseGroup()">Групповой чат</button>
</div><div style="margin-top:12px">`;
if(!chats.length)html+='<p class="note">Пока здесь пусто. Создай свою первую переписку ♡</p>';
chats.slice().reverse().forEach(c=>{
html+=`<div class="item chat">
<button style="background:none;text-align:left;flex:1;color:inherit" onclick="openChat('${c.id}')">
<strong>${escapeHTML(c.title)}</strong>
<small>${c.type==="group"?"Групповой чат":"Личная переписка"} · ${c.messages.length} сообщений</small>
</button>
<button class="action" onclick="renameChat('${c.id}')">✏️</button>
<button class="action" onclick="deleteChat('${c.id}')">🗑️</button>
</div>`;
});
html+="</div>";
}

if(name==="characters"){
renderCharacterCatalog();
panel.style.display="block";
return;
}

if(!["chats","characters"].includes(name)){
html+='<div class="item"><strong>Скоро здесь появится больше возможностей ♡</strong><p class="note">Мы постепенно создаём это приложение.</p></div>';
}
content.innerHTML=html;
panel.style.display="block";
}

/* КАТАЛОГ ПЕРСОНАЖЕЙ */
function renderCharacterCatalog(){
let html=`
<p class="note">Твоя коллекция персонажей из разных миров. Ищи любимых или добавляй собственных ♡</p>

<input class="field catalog-search" id="characterSearch" placeholder="🔎 Найти персонажа в своей коллекции..." value="${escapeHTML(catalogSearch)}" oninput="catalogSearch=this.value;renderCharacterList()">

<div class="category-list">`;
categories.forEach(cat=>{
html+=`<button class="${catalogCategory===cat?"active":""}" onclick="setCatalogCategory('${cat}')">${cat}</button>`;
});
html+=`</div>

<button class="primary" onclick="showAddCharacter()">＋ Добавить своего персонажа</button>

<div class="anilist-box">
<h3>🌸 Поиск по AniList</h3>
<p class="note">Ищи персонажей из аниме и манги по имени. Найденных можно добавить в свою коллекцию.</p>
<input class="field" id="aniSearch" placeholder="Например: Gojo Satoru" onkeydown="if(event.key==='Enter'){searchAniList()}">
<button class="primary" id="aniSearchButton" onclick="searchAniList()">🔎 Найти персонажа</button>
<div id="aniStatus" class="anilist-status"></div>
<div id="aniResults"></div>
</div>

<div class="catalog-source-box">
<h3>🎮 Поиск игровых персонажей</h3>
<p class="note">Поиск по Wikidata. Это общая база, поэтому проверяй произведение в описании результата.</p>
<input class="field" id="wikidataSearch" placeholder="Имя персонажа..." onkeydown="if(event.key==='Enter')searchCatalogSource('wikidata')">
<button class="primary" id="wikidataButton" onclick="searchCatalogSource('wikidata')">🔎 Искать в Wikidata</button>
<div id="wikidataStatus" class="anilist-status"></div>
<div id="wikidataResults"></div>
</div>

<div class="catalog-source-box">
<h3>📖 Поиск персонажей визуальных новелл</h3>
<p class="note">Ищи героев по имени в базе VNDB.</p>
<input class="field" id="vndbSearch" placeholder="Имя персонажа..." onkeydown="if(event.key==='Enter')searchCatalogSource('vndb')">
<button class="primary" id="vndbButton" onclick="searchCatalogSource('vndb')">🔎 Искать в VNDB</button>
<div id="vndbStatus" class="anilist-status"></div>
<div id="vndbResults"></div>
</div>

<div id="characterList"></div>`;
document.getElementById("panelContent").innerHTML=html;
renderCharacterList();
}

function setCatalogCategory(category){
catalogCategory=category;
renderCharacterCatalog();
}

function renderCharacterList(){
const list=document.getElementById("characterList");
if(!list)return;

const search=catalogSearch.trim().toLowerCase();
const filtered=characters.map((c,i)=>({c,i})).filter(({c})=>{
const isFavorite=favorites.includes(characterKey(c));
const categoryMatch=
catalogCategory==="Все"||
(catalogCategory==="Избранное"&&isFavorite)||
c[3]===catalogCategory;
const searchMatch=!search||
(c[0]+" "+c[1]+" "+c[3]).toLowerCase().includes(search);
return categoryMatch&&searchMatch;
});

if(!filtered.length){
list.innerHTML='<div class="empty">Здесь пока никого нет ♡<br>Можешь добавить персонажа самостоятельно.</div>';
return;
}

let html="";
filtered.forEach(({c,i})=>{
const favorite=favorites.includes(characterKey(c));
const avatar=c[4]
?`<img src="${escapeHTML(c[4])}" alt="">`
:escapeHTML(c[2]);

html+=`<div class="character-card">
<div class="character-top">
<div class="character-avatar">${avatar}</div>
<div class="character-info">
<strong>${escapeHTML(c[0])}</strong>
<small>${escapeHTML(c[1])}</small>
<small>${escapeHTML(c[3])}</small>
</div>
<button class="favorite" onclick="toggleFavorite(${i})">${favorite?"♥":"♡"}</button>
</div>
<div class="character-actions">
<button class="primary" onclick="createPrivate(${i})">Написать</button>
${i>=5?`<button class="action" onclick="removeCustomCharacter(${i})">Удалить</button>`:""}
</div>
</div>`;
});
list.innerHTML=html;
}

function toggleFavorite(index){
const key=characterKey(characters[index]);
if(favorites.includes(key)){
favorites=favorites.filter(x=>x!==key);
}else{
favorites.push(key);
}
saveFavorites();
renderCharacterList();
}

function showAddCharacter(){
document.getElementById("characterList").innerHTML=`
<div class="item">
<h3>Новый персонаж ♡</h3>
<input class="field" id="newCharName" placeholder="Имя персонажа">
<input class="field" id="newCharSource" placeholder="Из какого произведения?">
<input class="field" id="newCharEmoji" placeholder="Эмодзи для аватара" maxlength="8">
<select class="field" id="newCharCategory">
${categories.slice(2).map(c=>`<option value="${c}">${c}</option>`).join("")}
</select>
<button class="primary" onclick="addCustomCharacter()">Сохранить персонажа</button>
<button class="action" onclick="renderCharacterList()">Отмена</button>
<p class="note">Это твой собственный персонаж. Его данные сохранятся на этом устройстве.</p>
</div>`;
}

function addCustomCharacter(){
const name=document.getElementById("newCharName").value.trim();
const source=document.getElementById("newCharSource").value.trim()||"Авторский персонаж";
const emoji=document.getElementById("newCharEmoji").value.trim()||"✨";
const category=document.getElementById("newCharCategory").value;
if(!name){
alert("Напиши имя персонажа!");
return;
}
if(characters.some(c=>c[0].toLowerCase()===name.toLowerCase()&&c[1].toLowerCase()===source.toLowerCase())){
alert("Такой персонаж уже есть в каталоге.");
return;
}
characters.push([name,source,emoji,category]);
saveCharacters();
catalogCategory="Все";
catalogSearch="";
renderCharacterCatalog();
}

function removeCustomCharacter(index){
if(index<5)return;
if(!confirm("Удалить этого персонажа из каталога?"))return;
const removed=characters[index];
favorites=favorites.filter(x=>x!==characterKey(removed));
characters.splice(index,1);
saveCharacters();
saveFavorites();
renderCharacterList();
}

/* ПОИСК В WIKIDATA И VNDB */
async function searchCatalogSource(source){
const input=document.getElementById(source==="wikidata"?"wikidataSearch":"vndbSearch");
const status=document.getElementById(source+"Status");
const results=document.getElementById(source+"Results");
const button=document.getElementById(source+"Button");

if(!input||!status||!results||!button)return;

const query=input.value.trim();
if(!query){
status.textContent="Сначала введи имя персонажа ♡";
results.innerHTML="";
return;
}

button.disabled=true;
button.textContent="Ищем...";
status.textContent=source==="wikidata"
?"Ищем в Wikidata... 🎮"
:"Ищем в VNDB... 📖";
results.innerHTML="";

try{
const url="/api/catalog?source="+encodeURIComponent(source)+"&query="+encodeURIComponent(query);
const response=await fetch(url);
let data={};

try{
data=await response.json();
}catch(e){
throw new Error("Сервер вернул некорректный ответ.");
}

if(!response.ok){
throw new Error(data.error||"Ошибка сервера. Проверь api/catalog.js.");
}

catalogSourceResults[source]=Array.isArray(data.results)?data.results:[];

if(!catalogSourceResults[source].length){
status.textContent="Ничего не найдено. Попробуй другое написание имени.";
return;
}

status.textContent="Найдено результатов: "+catalogSourceResults[source].length+" ♡";

let html="";
catalogSourceResults[source].forEach((item,index)=>{
const name=item.name||"Без имени";
const description=item.description||"Описание отсутствует";
const game=item.game||"";
const image=item.image||"";

html+=`<div class="catalog-source-result">
${image?`<img src="${escapeHTML(image)}" alt="" loading="lazy">`:`<div class="character-avatar">${source==="wikidata"?"🎮":"📖"}</div>`}
<div class="catalog-source-result-info">
<strong>${escapeHTML(name)}</strong>
<small>${escapeHTML(description)}</small>
${game?`<small>Произведение: ${escapeHTML(game)}</small>`:""}
<button onclick="addCatalogCharacter('${source}',${index})">＋ Добавить</button>
</div>
</div>`;
});

results.innerHTML=html;

}catch(error){
status.textContent="Не удалось выполнить поиск: "+(error.message||"неизвестная ошибка");
}finally{
button.disabled=false;
button.textContent=source==="wikidata"?"🔎 Искать в Wikidata":"🔎 Искать в VNDB";
}
}

/* ПОИСК ПЕРСОНАЖЕЙ ANILIST */
async function searchAniList(){
const input=document.getElementById("aniSearch");
const status=document.getElementById("aniStatus");
const results=document.getElementById("aniResults");
const button=document.getElementById("aniSearchButton");

if(!input||!status||!results||!button)return;

const search=input.value.trim();
if(!search){
status.textContent="Сначала введи имя персонажа ♡";
results.innerHTML="";
return;
}

button.disabled=true;
button.textContent="Ищем...";
status.textContent="Ищем персонажей в AniList... 🌸";
results.innerHTML="";

const query=`
query ($search: String!) {
  Page(perPage: 12) {
    characters(search: $search, sort: SEARCH_MATCH) {
      id
      name {
        full
        native
      }
      image {
        large
      }
      media(perPage: 3, sort: POPULARITY_DESC) {
        nodes {
          title {
            romaji
            english
          }
        }
      }
    }
  }
}`;

try{
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),15000);

let response;
try{
response=await fetch("https://graphql.anilist.co",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({
query,
variables:{search}
}),
signal:controller.signal
});
}finally{
clearTimeout(timeout);
}

const data=await response.json();

if(!response.ok){
throw new Error(data.errors?.[0]?.message||"AniList ответил ошибкой. Попробуй ещё раз.");
}
if(data.errors&&data.errors.length){
throw new Error(data.errors[0].message||"Ошибка поиска AniList");
}

anilistResults=data.data?.Page?.characters||[];

if(!anilistResults.length){
status.textContent="Ничего не найдено. Попробуй другое написание имени.";
return;
}

status.textContent=`Нашлось персонажей: ${anilistResults.length} ♡`;

let html="";
anilistResults.forEach((character,index)=>{
const name=character.name?.full||"Без имени";
const image=character.image?.large||"";
const titles=(character.media?.nodes||[])
.map(m=>m.title?.english||m.title?.romaji)
.filter(Boolean);
const source=titles.length?titles.join(", "):"Аниме или манга";

html+=`<div class="anilist-result">
${image?`<img src="${escapeHTML(image)}" alt="" loading="lazy">`:`<div class="character-avatar">🌸</div>`}
<div class="anilist-result-info">
<strong>${escapeHTML(name)}</strong>
<small>${escapeHTML(source)}</small>
<button onclick="addAniListCharacter(${index})">＋ Добавить</button>
</div>
</div>`;
});

results.innerHTML=html;

}catch(error){
if(error.name==="AbortError"){
status.textContent="Поиск занял слишком много времени. Проверь интернет и попробуй ещё раз.";
}else{
status.textContent="Не удалось выполнить поиск: "+(error.message||"неизвестная ошибка");
}
}finally{
button.disabled=false;
button.textContent="🔎 Найти персонажа";
}
}

function addAniListCharacter(index){
const character=anilistResults[index];
if(!character)return;

const name=character.name?.full||"Без имени";
const titles=(character.media?.nodes||[])
.map(m=>m.title?.english||m.title?.romaji)
.filter(Boolean);
const source=titles[0]||"Аниме или манга";
const image=character.image?.large||"";

if(characters.some(c=>c[0].toLowerCase()===name.toLowerCase()&&c[1].toLowerCase()===source.toLowerCase())){
alert("Этот персонаж уже есть в каталоге ♡");
return;
}

characters.push([
name,
source,
"🌸",
"Аниме и манга",
image
]);

saveCharacters();
catalogCategory="Все";
catalogSearch="";
renderCharacterCatalog();

const status=document.getElementById("aniStatus");
if(status)status.textContent="Персонаж добавлен в твою коллекцию! ♡";
}

function renderChat(){

if(!chat)return;
let html=`<button class="back" onclick="openApp('chats')">← К перепискам</button>
<h2>${escapeHTML(chat.title)}</h2>

chat.messages.forEach((m,i)=>{
const mine=m.role==="user";
html+=`<div class="message ${mine?"mine":"theirs"}"
onpointerdown="startMessagePress(event,${i})"
onpointerup="cancelMessagePress()"
onpointerleave="cancelMessagePress()"
onpointercancel="cancelMessagePress()"
oncontextmenu="return false">

});

function startMessagePress(event,index){
if(event.pointerType==="mouse"&&event.button!==0)return;
cancelMessagePress();
messagePressTimer=setTimeout(()=>{
messagePressTimer=null;
showMessageMenu(index);
},550);
}

function cancelMessagePress(){
if(messagePressTimer!==null){
clearTimeout(messagePressTimer);
messagePressTimer=null;
}
}

function showMessageMenu(index){
closeMessageMenu();
selectedMessageIndex=index;
const chat=getChat();

const message=chat.messages[index];
if(!message)return;
const mine=message.role==="user";

let html=`<div id="messageMenu" style="position:fixed;inset:0;background:#49374455;z-index:1000;display:flex;align-items:center;justify-content:center;padding:25px" onclick="closeMessageMenu()">
<div style="background:#fff8fc;padding:20px;border-radius:22px;width:100%;max-width:300px;box-shadow:0 8px 30px #49374433" onclick="event.stopPropagation()">
<strong>Действия с сообщением</strong>
<div class="row" style="margin-top:15px">
${mine?`<button class="action" onclick="editMessage(selectedMessageIndex);closeMessageMenu()">✏️ Изменить</button>`:""}
${mine?`<button class="action" onclick="deleteMessage(selectedMessageIndex);closeMessageMenu()">🗑️ Удалить</button>`:""}
${!mine?`<button class="action" onclick="regenerate(selectedMessageIndex);closeMessageMenu()">🔄 Повторить ответ</button>`:""}
<button class="action" onclick="copyMessage()">📋 Копировать</button>
</div>
<button class="back" style="margin-top:12px" onclick="closeMessageMenu()">Закрыть</button>
</div></div>`;
document.body.insertAdjacentHTML("beforeend",html);
}

function closeMessageMenu(){
const menu=document.getElementById("messageMenu");
if(menu)menu.remove();
}

async function copyMessage(){
const chat=getChat();
if(!chat)return;
const message=chat.messages[selectedMessageIndex];
if(!message)return;
try{
await navigator.clipboard.writeText(message.content);
}catch(e){
alert("Не удалось скопировать. Попробуй ещё раз.");
}
closeMessageMenu();
}

function saveStoryMemory(){
const chat=getChat();
const input=document.getElementById("storyMemoryInput");

if(!chat||!input)return;

saveChats();
closeStoryMemory();
renderChat();
}

function closeStoryMemory(){
const modal=document.getElementById("storyMemoryModal");
if(modal)modal.remove();
}

async function editMessage(index){
const chat=getChat();
if(!chat||!chat.messages[index]||chat.messages[index].role!=="user")return;
if(busy)return;
const value=prompt("Измени своё сообщение. Ответы персонажей после него будут удалены:",chat.messages[index].content);
if(value===null)return;
const newText=value.trim();
if(!newText){alert("Сообщение не может быть пустым!");return;}
chat.messages[index].content=newText;
chat.messages=chat.messages.slice(0,index+1);
saveChats();
renderChat();
await askAI(chat);
}

function deleteMessage(index){
const chat=getChat();
if(!chat)return;
const message=chat.messages[index];
if(!message||busy)return;
if(!confirm("Удалить сообщение и связанный с ним ответ?"))return;
if(message.role==="user"&&chat.messages[index+1]?.role==="assistant"){
chat.messages.splice(index,2);
}else{
chat.messages.splice(index,1);
}
saveChats();
renderChat();
}

async function regenerate(index){
const chat=getChat();
if(!chat||busy)return;
if(!chat.messages[index]||chat.messages[index].role!=="assistant")return;
chat.messages=chat.messages.slice(0,index);
saveChats();
renderChat();
await askAI(chat);
}

async function sendChat(event){
event.preventDefault();
if(busy)return;
const input=document.getElementById("chatInput");
if(!input)return;
const message=input.value.trim();
const chat=getChat();
if(!message||!chat)return;
chat.messages.push({role:"user",content:message});
saveChats();
renderChat();
await askAI(chat);
}

async function askAI(chat){
if(busy)return;
busy=true;
const status=document.getElementById("chatStatus");
if(status)status.textContent="Персонаж печатает... 💭";
const button=document.getElementById("sendButton");
if(button)button.disabled=true;
try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
character:chat.participants.join(", "),
messages:chat.messages.slice(-30),
memory:chat.memory,
group:chat.type==="group",
participants:chat.participants
})
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Ошибка сервера");
if(!data.reply)throw new Error("ИИ прислал пустой ответ");
chat.messages.push({role:"assistant",content:data.reply});
saveChats();
}catch(error){
chat.messages.push({role:"assistant",content:"Не удалось получить ответ: "+error.message});
saveChats();
}finally{
busy=false;
if(getChat()&&getChat().id===chat.id)renderChat();
}
}

if (!categories.includes("Клуб Романтики")) {
  categories.push("Клуб Романтики");
}

if (!catalogSourceResults.romanceclub) {
  catalogSourceResults.romanceclub = [];

const oldRenderCharacterCatalog = renderCharacterCatalog;

renderCharacterCatalog = function() {
  oldRenderCharacterCatalog();

  const list = document.getElementById("characterList");
  if (!list || document.getElementById("romanceClubBox")) return;

  const box = document.createElement("div");
  box.className = "catalog-source-box";
  box.id = "romanceClubBox";

  box.innerHTML = `
    <h3>💗 Поиск по Клубу Романтики</h3>
    <p class="note">Ищи персонажей из историй КР по имени.</p>
    <input class="field" id="romanceclubSearch"
      placeholder="Например: Александр..."
      onkeydown="if(event.key==='Enter')searchCatalogSource('romanceclub')">
    <button class="primary" id="romanceclubButton"
      onclick="searchCatalogSource('romanceclub')">
      🔎 Искать в Клубе Романтики
    </button>
    <div id="romanceclubStatus" class="anilist-status"></div>
    <div id="romanceclubResults"></div>
  `;

  list.parentNode.insertBefore(box, list);
};

const oldCatalogSearch = searchCatalogSource;

searchCatalogSource = async function(source) {
  if (source !== "romanceclub") {
    return oldCatalogSearch(source);
  }

  const input = document.getElementById("romanceclubSearch");
  const status = document.getElementById("romanceclubStatus");
  const results = document.getElementById("romanceclubResults");
  const button = document.getElementById("romanceclubButton");

  const query = input?.value.trim();

  if (!query) {
    status.textContent = "Сначала введи имя персонажа ♡";
    results.innerHTML = "";
    return;
  }

  button.disabled = true;
  button.textContent = "Ищем...";
  status.textContent = "Ищем персонажей КР... 💗";
  results.innerHTML = "";

  try {
    const url = "/api/catalog?source=romanceclub&query=" +
      encodeURIComponent(query);

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка поиска");
    }

    catalogSourceResults.romanceclub =
      Array.isArray(data.results) ? data.results : [];

    if (!catalogSourceResults.romanceclub.length) {
      status.textContent =
        "Ничего не найдено. Попробуй другое написание имени.";
      return;
    }

    status.textContent =
      "Найдено персонажей: " +
      catalogSourceResults.romanceclub.length + " ♡";

    results.innerHTML = catalogSourceResults.romanceclub
      .map((item, index) => `
        <div class="catalog-source-result">
          ${
            item.image
              ? `<img src="${escapeHTML(item.image)}" alt="" loading="lazy">`
              : `<div class="character-avatar">💗</div>`
          }
          <div class="catalog-source-result-info">
            <strong>${escapeHTML(item.name || "Без имени")}</strong>
            <small>${escapeHTML(item.description || "Персонаж Клуба Романтики")}</small>
            <small>Клуб Романтики</small>
            <button onclick="addCatalogCharacter('romanceclub',${index})">
              ＋ Добавить
            </button>
          </div>
        </div>
      `).join("");

  } catch (error) {
    status.textContent =
      "Ошибка поиска: " + (error.message || "неизвестная ошибка");
  } finally {
    button.disabled = false;
    button.textContent = "🔎 Искать в Клубе Романтики";
  }
};

const oldAddCatalogCharacter = addCatalogCharacter;

addCatalogCharacter = function(source, index) {
  if (source !== "romanceclub") {
    return oldAddCatalogCharacter(source, index);
  }

  const item = catalogSourceResults.romanceclub?.[index];
  if (!item) return;

  const name = (item.name || "").trim();
  if (!name) return;

  const game = item.game || "Клуб Романтики";

  if (characters.some(c =>
    c[0].toLowerCase() === name.toLowerCase() &&
    c[1].toLowerCase() === game.toLowerCase()
  )) {
    alert("Этот персонаж уже есть в каталоге ♡");
    return;
  }

  characters.push([
    name,
    game,
    "💗",
    "Клуб Романтики",
    item.image || ""
  ]);

  saveCharacters();
  catalogCategory = "Все";
  catalogSearch = "";
  renderCharacterCatalog();

  alert("Персонаж добавлен в твою коллекцию! ♡");
};
