

<!DOCTYPE html>

<style>

/* ===== АВТОДОСЬЕ ===== */

.dossier-draft textarea{width:100%;min-height:90px;resize:vertical;border:1px solid #ead0dd;border-radius:12px;padding:10px;background:#fffafd;color:#493744;font:inherit;font-size:13px;line-height:1.5}
.dossier-apply{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4;color:#805b73;margin:9px 0}

</style>

<body>
<div class="phone">
<div class="status"><span id="statusTime">09:41</span><span>●●● Wi-Fi ▰</span></div>

<section class="screen lock" id="lock">
<div class="date" id="date"></div>
<div class="clock" id="clock">09:41</div>
<h1>Roleplay Club</h1>
<p>Твой маленький виртуальный мир ♡</p>
<button class="unlock" onclick="unlock()">Разблокировать →</button>
</section>

<div class="greeting">Привет, дорогая ♡</div>

<div class="widget"><strong>✧ ТВОЁ ПРОСТРАНСТВО</strong><p>Здесь начинаются истории, знакомства и приключения.</p></div>
<div class="grid">
<button class="app" onclick="openApp('chats')"><span class="app-icon">💬</span>Сообщения</button>
<button class="app" onclick="openApp('characters')"><span class="app-icon">🎭</span>Персонажи</button>
<button class="app" onclick="openApp('social')"><span class="app-icon">📸</span>Pinkstagram</button>
<button class="app" onclick="openApp('gallery')"><span class="app-icon">🌷</span>Галерея</button>
<button class="app" onclick="openApp('music')"><span class="app-icon">🎧</span>Melody</button>
<button class="app" onclick="openApp('diary')"><span class="app-icon">📔</span>Дневник</button>
<button class="app" onclick="openApp('contacts')"><span class="app-icon">👥</span>Контакты</button>
<button class="app" onclick="openApp('settings')"><span class="app-icon">⚙️</span>Настройки</button>
</div>

<button onclick="openApp('chats')">💬</button>
<button onclick="openApp('social')">📸</button>
<button onclick="openApp('gallery')">🖼️</button>
<button onclick="openApp('settings')">⚙️</button>
</div>

</div>

<script>
/* ===== SUPABASE: ПОДКЛЮЧЕНИЕ И АВТОРИЗАЦИЯ ===== */
const SUPABASE_URL="https://mndnnpunaatbljawhqtx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_FRWQe8IT4FqaQf83K8khIQ_lllftJ-R";
let supabaseClient=null;
let currentUser=null;
let authMessage="Проверяем подключение...";
let authReady=false;
let passwordRecoveryMode=false;

function isPasswordRecoveryLink(){
const query=new URLSearchParams(window.location.search);
const hash=new URLSearchParams(window.location.hash.replace(/^#/,""));
return query.get("type")==="recovery"||hash.get("type")==="recovery";
}

try{
if(window.supabase&&window.supabase.createClient){
supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
supabaseClient.auth.onAuthStateChange((event,session)=>{
currentUser=session?.user||null;
authReady=true;
if(event==="SIGNED_IN")authMessage="Ты вошла в аккаунт! ♡";
if(event==="SIGNED_OUT")authMessage="Ты вышла из аккаунта.";
if(event==="PASSWORD_RECOVERY"){
passwordRecoveryMode=true;
authMessage="Подтверди новый пароль для своего аккаунта.";
setTimeout(showPasswordRecoveryForm,100);
}
if(document.getElementById("authStatus"))renderAuthCard();
});
supabaseClient.auth.getSession().then(({data,error})=>{
if(error)authMessage="Не удалось проверить сессию: "+error.message;
currentUser=data?.session?.user||null;
authReady=true;
if(document.getElementById("authStatus"))renderAuthCard();
if(isPasswordRecoveryLink()&&currentUser){
passwordRecoveryMode=true;
setTimeout(showPasswordRecoveryForm,300);
}
}).catch(()=>{
authReady=true;
authMessage="Не удалось подключиться к Supabase. Проверь интернет.";
});
}else{
authReady=true;
authMessage="Не загрузилась библиотека Supabase. Обнови страницу.";
}
}catch(error){
authReady=true;
authMessage="Ошибка подключения: "+error.message;
}

function renderAuthCard(){
const status=document.getElementById("authStatus");
const account=document.getElementById("authAccount");
const form=document.getElementById("authForm");
if(!status||!account||!form)return;
status.textContent=authMessage;
if(currentUser){
form.style.display="none";
account.style.display="block";
account.innerHTML=`
<div class="auth-user">
<strong>♡ Ты вошла в Roleplay Club</strong>
<p class="note">${escapeHTML(currentUser.email||"Аккаунт Supabase")}</p>
</div>
<button class="action" onclick="signOutAccount()">Выйти из аккаунта</button>
<p class="note">Твои нынешние переписки и персонажи пока хранятся на этом устройстве.</p>`;
}else{
form.style.display="block";
account.style.display="none";
}
}

function showPasswordRecoveryForm(){
if(!supabaseClient||!currentUser)return;
let old=document.getElementById("passwordRecoveryModal");
if(old)old.remove();
const overlay=document.createElement("div");
overlay.id="passwordRecoveryModal";
overlay.className="password-recovery-overlay";
overlay.innerHTML=`
<div class="password-recovery-card">
<h2>♡ Новый пароль</h2>
<p>Придумай новый пароль для Roleplay Club. Введи его дважды, чтобы мы убедились, что нет ошибки.</p>
<input class="field" id="newAccountPassword" type="password" autocomplete="new-password" placeholder="Новый пароль (минимум 6 символов)">
<input class="field" id="confirmAccountPassword" type="password" autocomplete="new-password" placeholder="Повтори новый пароль">
<div id="passwordRecoveryStatus" class="auth-status"></div>
<button class="primary" id="saveNewPasswordButton" onclick="saveNewAccountPassword()">Сохранить новый пароль</button>
<button class="action" onclick="closePasswordRecoveryForm()">Не сейчас</button>
</div>`;
document.body.appendChild(overlay);
}

function closePasswordRecoveryForm(){
const modal=document.getElementById("passwordRecoveryModal");
if(modal)modal.remove();
}

async function saveNewAccountPassword(){
if(!supabaseClient){showToast("Supabase пока не подключён.");return}
const password=document.getElementById("newAccountPassword")?.value||"";
const confirmation=document.getElementById("confirmAccountPassword")?.value||"";
const status=document.getElementById("passwordRecoveryStatus");
const button=document.getElementById("saveNewPasswordButton");
if(password.length<6){status.textContent="Пароль должен содержать минимум 6 символов.";return}
if(password!==confirmation){status.textContent="Пароли не совпадают. Проверь оба поля.";return}
button.disabled=true;button.textContent="Сохраняем...";status.textContent="Обновляем пароль...";
const {data,error}=await supabaseClient.auth.updateUser({password});
button.disabled=false;button.textContent="Сохранить новый пароль";
if(error){status.textContent="Не удалось изменить пароль: "+error.message;return}
passwordRecoveryMode=false;authMessage="Пароль успешно изменён! ♡";currentUser=data?.user||currentUser;
closePasswordRecoveryForm();
if(document.getElementById("authStatus"))renderAuthCard();
showToast("Новый пароль сохранён! ♡");
}

async function signUpAccount(){
if(!supabaseClient){alert("Supabase пока не подключён.");return}
const email=document.getElementById("authEmail").value.trim();
const password=document.getElementById("authPassword").value;
if(!email||!password){authMessage="Введи электронную почту и пароль.";renderAuthCard();return}
if(password.length<6){authMessage="Пароль должен содержать минимум 6 символов.";renderAuthCard();return}

function chooseCharacterPhoto(index){
avatarTargetIndex=index;
let picker=document.getElementById("characterPhotoPicker");
if(!picker){
picker=document.createElement("input");picker.type="file";picker.accept="image/*";picker.id="characterPhotoPicker";
picker.style.display="none";picker.addEventListener("change",handleCharacterPhoto);
document.body.appendChild(picker);
}
picker.value="";picker.click();

function handleCharacterPhoto(event){
const file=event.target.files?.[0];if(!file||avatarTargetIndex===null)return;
if(!file.type.startsWith("image/")){alert("Выбери изображение.");return}
const index=avatarTargetIndex;const character=characters[index];avatarTargetIndex=null;
const reader=new FileReader();
reader.onload=()=>{
const image=new Image();
image.onload=()=>{
const max=700;const scale=Math.min(1,max/Math.max(image.width,image.height));
const canvas=document.createElement("canvas");
canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);
const ctx=canvas.getContext("2d");ctx.drawImage(image,0,0,canvas.width,canvas.height);
const data=canvas.toDataURL("image/jpeg",.76);
avatarOverrides[characterKey(character)]=data;
try{
saveAvatars();
if(document.getElementById("profile-description"))openCharacterProfile(index);
else renderCharacterList();
showToast("Фотография персонажа обновлена ♡");
}
catch(e){delete avatarOverrides[characterKey(character)];alert("Не удалось сохранить фото. Возможно, в памяти браузера закончилось место. Попробуй другое, более маленькое изображение.")}
};
image.onerror=()=>alert("Не удалось открыть это изображение.");
image.src=reader.result;
};
reader.readAsDataURL(file);
}
function resetCharacterPhoto(index){
const c=characters[index];if(!c)return;
if(!confirm("Вернуть исходную фотографию персонажа?"))return;
delete avatarOverrides[characterKey(c)];saveAvatars();
if(document.getElementById("profile-description"))openCharacterProfile(index);
else renderCharacterList();
showToast("Исходная фотография восстановлена ♡");
}

async function searchCatalogSource(source){
const input=document.getElementById(source==="wikidata"?"wikidataSearch":"vndbSearch");

const results=document.getElementById(source+"Results");

if(!query){status.textContent="Сначала введи имя персонажа ♡";results.innerHTML="";return}
button.disabled=true;button.textContent="Ищем...";
status.textContent=source==="wikidata"?"Ищем в Wikidata... 🎮":"Ищем в VNDB... 📖";results.innerHTML="";

/* ===== ПОИСК ANILIST ===== */
async function searchAniList(){
const input=document.getElementById("aniSearch"),status=document.getElementById("aniStatus"),results=document.getElementById("aniResults"),button=document.getElementById("aniSearchButton");
if(!input||!status||!results||!button)return;
const search=input.value.trim();if(!search){status.textContent="Сначала введи имя персонажа ♡";results.innerHTML="";return}
button.disabled=true;button.textContent="Ищем...";status.textContent="Ищем персонажей в AniList... 🌸";results.innerHTML="";
const query=`query ($search: String!) {
Page(perPage: 12) {
characters(search: $search, sort: SEARCH_MATCH) {
id name { full native } image { large }
media(perPage: 3, sort: POPULARITY_DESC) { nodes { title { romaji english } } }
}
}
}`;
try{
const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
let response;
try{response=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query,variables:{search}}),signal:controller.signal})}
finally{clearTimeout(timeout)}
const data=await response.json();
if(!response.ok)throw new Error(data.errors?.[0]?.message||"AniList ответил ошибкой. Попробуй ещё раз.");
if(data.errors&&data.errors.length)throw new Error(data.errors[0].message||"Ошибка поиска AniList");
anilistResults=data.data?.Page?.characters||[];
if(!anilistResults.length){status.textContent="Ничего не найдено. Попробуй другое написание имени.";return}
status.textContent=`Нашлось персонажей: ${anilistResults.length} ♡`;
results.innerHTML=anilistResults.map((character,index)=>{
const name=character.name?.full||"Без имени",image=character.image?.large||"";
const titles=(character.media?.nodes||[]).map(m=>m.title?.english||m.title?.romaji).filter(Boolean);
const source=titles.length?titles.join(", "):"Аниме или манга";
return `<div class="anilist-result">${image?`<img src="${escapeHTML(image)}" alt="" loading="lazy">`:`<div class="character-avatar">🌸</div>`}
<div class="anilist-result-info"><strong>${escapeHTML(name)}</strong><small>${escapeHTML(source)}</small><button onclick="addAniListCharacter(${index})">＋ Добавить</button></div></div>`;
}).join("");
}catch(error){
if(error.name==="AbortError")status.textContent="Поиск занял слишком много времени. Проверь интернет и попробуй ещё раз.";
else status.textContent="Не удалось выполнить поиск: "+(error.message||"неизвестная ошибка");
}finally{button.disabled=false;button.textContent="🔎 Найти персонажа"}
}
function addAniListCharacter(index){
const character=anilistResults[index];if(!character)return;
const name=character.name?.full||"Без имени";
const titles=(character.media?.nodes||[]).map(m=>m.title?.english||m.title?.romaji).filter(Boolean);
const source=titles[0]||"Аниме или манга";const image=character.image?.large||"";
if(characters.some(c=>c[0].toLowerCase()===name.toLowerCase()&&c[1].toLowerCase()===source.toLowerCase())){alert("Этот персонаж уже есть в каталоге ♡");return}
characters.push([name,source,"🌸","Аниме и манга",image]);saveCharacters();catalogCategory="Все";catalogSearch="";renderCharacterCatalog();
}

async function editMessage(index){
const chat=getChat();if(!chat||!chat.messages[index]||chat.messages[index].role!=="user"||busy)return;
const value=prompt("Измени своё сообщение. Ответы персонажей после него будут удалены:",chat.messages[index].content);
if(value===null)return;
const newText=value.trim();if(!newText){alert("Сообщение не может быть пустым!");return}
chat.messages[index].content=newText;chat.messages[index].createdAt=new Date().toISOString();
chat.messages=chat.messages.slice(0,index+1);saveChats();renderChat();await askAI(chat);
}
function deleteMessage(index){
const chat=getChat();if(!chat)return;
const message=chat.messages[index];if(!message||busy)return;
if(!confirm("Удалить сообщение и связанный с ним ответ?"))return;
if(message.role==="user"&&chat.messages[index+1]?.role==="assistant")chat.messages.splice(index,2);
else chat.messages.splice(index,1);
saveChats();renderChat();
}
async function regenerate(index){
const chat=getChat();if(!chat||busy||!chat.messages[index]||chat.messages[index].role!=="assistant")return;
chat.messages=chat.messages.slice(0,index);saveChats();renderChat();await askAI(chat);
}
async function sendChat(event){
event.preventDefault();if(busy)return;
const input=document.getElementById("chatInput");if(!input)return;
const message=input.value.trim(),chat=getChat();if(!message||!chat)return;
chat.messages.push({role:"user",content:message,createdAt:new Date().toISOString()});
saveChats();renderChat();await askAI(chat);
}

/* ===== ИИ: ПЕРЕДАЧА АНКЕТ ПЕРСОНАЖЕЙ И ПАМЯТИ СЮЖЕТА ===== */
async function askAI(chat){
if(busy)return;

busy=true;
typingChatId=chat.id;

if(getChat()&&getChat().id===chat.id)renderChat();

try{
const profiles={};

for(const name of chat.participants||[]){
const character=characters.find(c=>c[0]===name);
if(!character)continue;

const profile=characterProfiles[characterKey(character)];
if(!profile)continue;

profiles[name]={
description:profile.description||"",
age:profile.age||"",
appearance:profile.appearance||"",
personality:profile.personality||"",
speech:profile.speech||"",
habits:profile.habits||"",
backstory:profile.backstory||""
};
}

const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
character:(chat.participants||[]).join(", "),
messages:chat.messages.slice(-40).map(m=>({
role:m.role,
content:m.content
})),
memory:chat.memory||"",
group:chat.type==="group",
participants:chat.participants||[],
profiles:profiles
})
});

let data={};
try{
data=await response.json();
}catch(error){
throw new Error("Сервер вернул некорректный ответ.");
}

if(!response.ok)throw new Error(data.error||"Ошибка сервера");
if(!data.reply||!String(data.reply).trim())throw new Error("ИИ прислал пустой ответ");

chat.messages.push({
role:"assistant",
content:String(data.reply).trim(),
createdAt:new Date().toISOString()
});

saveChats();
addNotification(chat,data.reply);

}catch(error){
const errorText="Не удалось получить ответ: "+(error.message||"неизвестная ошибка");

chat.messages.push({
role:"assistant",
content:errorText,
createdAt:new Date().toISOString()
});

saveChats();
addNotification(chat,errorText);

}finally{
busy=false;
typingChatId=null;

if(getChat()&&getChat().id===chat.id)renderChat();
}
}

if(characters.some(c=>c[0].toLowerCase()===name.toLowerCase()&&c[1].toLowerCase()===game.toLowerCase())){alert("Этот персонаж уже есть в каталоге ♡");return}
characters.push([name,game,"💗","Клуб Романтики",item.image||""]);
saveCharacters();catalogCategory="Все";catalogSearch="";renderCharacterCatalog();alert("Персонаж добавлен в твою коллекцию! ♡");
};

/* ===== ФИЛЬМЫ И СЕРИАЛЫ ===== */
const renderCatalogWithRomance=renderCharacterCatalog;
renderCharacterCatalog=function(){
renderCatalogWithRomance();
const list=document.getElementById("characterList");
if(!list||document.getElementById("moviesCatalogBox"))return;

const box=document.createElement("div");
box.className="catalog-source-box";
box.id="moviesCatalogBox";
box.innerHTML=`
<h3>🎬 Поиск персонажей из фильмов и сериалов</h3>
<p class="note">Ищи персонажей кино и сериалов по имени. Поиск использует Wikidata. У некоторых результатов могут отсутствовать фотографии или подробные описания.</p>
<input class="field" id="moviesSearch" placeholder="Например: Wednesday Addams..." onkeydown="if(event.key==='Enter')searchCatalogSource('movies')">
<button class="primary" id="moviesButton" onclick="searchCatalogSource('movies')">🔎 Найти персонажа</button>
<div id="moviesStatus" class="anilist-status"></div>
<div id="moviesResults"></div>`;

list.parentNode.insertBefore(box,list);
};

const searchWithRomance=searchCatalogSource;
searchCatalogSource=async function(source){
if(source!=="movies")return searchWithRomance(source);

const input=document.getElementById("moviesSearch");
const status=document.getElementById("moviesStatus");
const results=document.getElementById("moviesResults");
const button=document.getElementById("moviesButton");

if(!input||!status||!results||!button)return;

const query=input.value.trim();
if(!query){
status.textContent="Сначала введи имя персонажа ♡";
results.innerHTML="";
return;
}

button.disabled=true;
button.textContent="Ищем...";
status.textContent="Ищем персонажей фильмов и сериалов... 🎬";
results.innerHTML="";

try{
const response=await fetch("/api/catalog?source=movies&query="+encodeURIComponent(query));
let data={};
try{data=await response.json()}catch(e){throw new Error("Сервер вернул некорректный ответ.")}

if(!response.ok)throw new Error(data.error||"Ошибка поиска. Проверь api/catalog.js.");

catalogSourceResults.movies=Array.isArray(data.results)?data.results:[];

if(!catalogSourceResults.movies.length){
status.textContent="Ничего не найдено. Попробуй другое написание имени.";
return;
}

status.textContent="Найдено результатов: "+catalogSourceResults.movies.length+" ♡";

results.innerHTML=catalogSourceResults.movies.map((item,index)=>{
const name=item.name||"Без имени";
const description=item.description||"Описание отсутствует";
const image=item.image||"";

return `<div class="catalog-source-result">
${image?`<img src="${escapeHTML(image)}" alt="" loading="lazy">`:`<div class="character-avatar">🎬</div>`}
<div class="catalog-source-result-info">
<strong>${escapeHTML(name)}</strong>
<small>${escapeHTML(description)}</small>
<small>Источник: Wikidata</small>
<button onclick="addCatalogCharacter('movies',${index})">＋ Добавить в каталог</button>
</div>
</div>`;
}).join("");

}catch(error){
status.textContent="Не удалось выполнить поиск: "+(error.message||"неизвестная ошибка");
}finally{
button.disabled=false;
button.textContent="🔎 Найти персонажа";
}
};

const addWithRomance=addCatalogCharacter;
addCatalogCharacter=function(source,index){
if(source!=="movies")return addWithRomance(source,index);

const item=catalogSourceResults.movies?.[index];
if(!item)return;

const name=(item.name||"").trim();
if(!name){
alert("У этого результата нет имени.");
return;
}

const sourceTitle="Фильмы и сериалы";

if(characters.some(c=>
c[0].toLowerCase()===name.toLowerCase()&&
c[1].toLowerCase()===sourceTitle.toLowerCase()
)){
alert("Этот персонаж уже есть в каталоге ♡");
return;
}

characters.push([
name,
sourceTitle,
"🎬",
"Фильмы и сериалы",
item.image||""
]);

saveCharacters();
catalogCategory="Фильмы и сериалы";
catalogSearch="";
renderCharacterCatalog();
showToast("Персонаж добавлен в коллекцию! ♡");
};

/* ===== АВТОРИЗАЦИЯ В НАСТРОЙКАХ ===== */

openApp=function(name){
originalOpenApp(name);if(name!=="settings")return;
const content=document.getElementById("panelContent");
content.innerHTML+=`
<div class="auth-card">
<h3>👤 Аккаунт Roleplay Club</h3>
<p class="note">Создай аккаунт, чтобы подготовить сайт к облачному сохранению и синхронизации.</p>
<div id="authStatus" class="auth-status">Проверяем подключение...</div>
<div id="authAccount" style="display:none"></div>

<input class="field" id="authEmail" type="email" autocomplete="email" placeholder="Электронная почта">

/* =====================================================
   АВТОДОСЬЕ ПЕРСОНАЖЕЙ
   Tavily ищет источники, Groq собирает анкету.
   Черновик не сохраняется автоматически.
===================================================== */

const dossierFields=[
{key:"description",title:"✧ Краткое описание",placeholder:"Кто этот персонаж?"},
{key:"age",title:"🎂 Возраст",placeholder:"Возраст персонажа"},
{key:"appearance",title:"🪞 Внешность",placeholder:"Внешность, одежда, особенности"},
{key:"personality",title:"💗 Характер",placeholder:"Черты характера и поведение"},
{key:"speech",title:"💬 Манера речи",placeholder:"Как разговаривает персонаж"},
{key:"habits",title:"🌷 Привычки и особенности",placeholder:"Привычки, интересы и особенности"},
{key:"backstory",title:"📖 Биография и история",placeholder:"Прошлое и важные события"}
];

let currentDossierDraft=null;
let currentDossierIndex=null;
let dossierRequestInProgress=false;

function dossierText(value){
if(value===null||value===undefined)return "";
if(typeof value==="string")return value;
if(typeof value==="number"||typeof value==="boolean")return String(value);
try{return JSON.stringify(value,null,2)}catch(e){return String(value)}
}

function dossierSafeUrl(value){
if(typeof value!=="string")return "";
try{
const url=new URL(value);
if(url.protocol!=="https:"&&url.protocol!=="http:")return "";
return url.href;
}catch(e){return ""}
}

function dossierSourceLink(source,index){
let url="",title="Источник "+(index+1);
if(typeof source==="string"){
url=dossierSafeUrl(source);
title=url?url:"Источник "+(index+1);
}else if(source&&typeof source==="object"){
url=dossierSafeUrl(source.url||source.href||source.link);
title=source.title||source.name||source.source||source.url||title;
}
if(!url){
return `<div>• ${escapeHTML(title)}</div>`;
}
return `<div>• <a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a></div>`;
}

function dossierFieldSourceText(value){
if(!value)return "";
if(Array.isArray(value)){
return value.map(item=>{
if(typeof item==="string")return item;
return item?.title||item?.name||item?.url||"";
}).filter(Boolean).join(" · ");
}
if(typeof value==="object"){
return value.title||value.name||value.url||dossierText(value);
}
return String(value);
}

function dossierProfileCurrentValue(index,field){
const character=characters[index];
if(!character)return "";
const profile=getCharacterProfile(character);
const textarea=document.getElementById("profile-"+field);
return textarea?textarea.value:(profile[field]||"");
}

function dossierAddPanel(index){
const character=characters[index];
if(!character)return;
const panel=document.getElementById("panelContent");
const hint=panel.querySelector(".profile-hint");
if(!hint)return;

const box=document.createElement("section");
box.className="dossier-box";
box.id="characterDossierBox";
box.innerHTML=`
<h3>✨ Заполнить досье с помощью ИИ</h3>
<p class="note">ИИ поищет информацию в интернете, сверит найденные сведения и подготовит черновик анкеты. Ты сможешь всё проверить и отредактировать перед сохранением.</p>
<label class="note" for="dossierName">Имя персонажа</label>
<input class="field" id="dossierName" maxlength="120" value="${escapeHTML(character[0])}" placeholder="Имя персонажа">
<label class="note" for="dossierWork">Произведение</label>
<input class="field" id="dossierWork" maxlength="180" value="${escapeHTML(character[1])}" placeholder="Название произведения">
<label class="note" for="dossierVersion">Версия, адаптация или часть</label>
<input class="field" id="dossierVersion" maxlength="180" placeholder="Например: второй сезон, ремейк, конкретная ветка">
<label class="note" for="dossierNotes">Дополнительные уточнения (необязательно)</label>
<textarea class="field" id="dossierNotes" maxlength="1000" rows="3" placeholder="Например: нужна информация строго по событиям второй части, без спойлеров из продолжения."></textarea>
<button class="primary dossier-search-button" id="dossierSearchButton" onclick="searchCharacterDossier(${index})">🔎 Найти информацию и составить досье</button>
<div class="dossier-status" id="dossierStatus"></div>
<div id="dossierDraftArea"></div>
`;
hint.insertAdjacentElement("afterend",box);
}

const originalOpenCharacterProfile=openCharacterProfile;
openCharacterProfile=function(index){
originalOpenCharacterProfile(index);
if(currentDossierIndex!==index){
currentDossierDraft=null;
currentDossierIndex=null;
}
dossierAddPanel(index);
if(currentDossierDraft&&currentDossierIndex===index){
renderDossierDraft(index);
}
};

async function searchCharacterDossier(index){
const character=characters[index];
if(!character)return;
if(dossierRequestInProgress)return;

const nameInput=document.getElementById("dossierName");
const workInput=document.getElementById("dossierWork");
const versionInput=document.getElementById("dossierVersion");
const notesInput=document.getElementById("dossierNotes");
const status=document.getElementById("dossierStatus");
const button=document.getElementById("dossierSearchButton");

if(!nameInput||!workInput||!status||!button)return;

const name=nameInput.value.trim();
const work=workInput.value.trim();
const version=versionInput?.value.trim()||"";
const notes=notesInput?.value.trim()||"";

if(!name){status.textContent="Введи имя персонажа.";nameInput.focus();return}
if(!work){status.textContent="Укажи произведение, чтобы ИИ не перепутал персонажа.";workInput.focus();return}

if(currentDossierDraft&&currentDossierIndex===index){
const accepted=confirm("Предыдущий черновик будет заменён новым поиском. Он ещё не сохранён в профиль. Продолжить?");
if(!accepted)return;
}

dossierRequestInProgress=true;
button.disabled=true;
button.textContent="Ищем информацию...";
status.textContent="Шаг 1 из 2: ищем сведения и источники в интернете. Это может занять некоторое время.";
document.getElementById("dossierDraftArea").innerHTML="";

try{
const controller=new AbortController();
const timeout=setTimeout(()=>controller.abort(),90000);
let response;
try{
response=await fetch("/api/dossier",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({name,work,version,notes}),
signal:controller.signal
});
}finally{
clearTimeout(timeout);
}

let data={};
try{data=await response.json()}
catch(e){throw new Error("Сервер вернул некорректный ответ. Проверь api/dossier.js.")}

if(!response.ok){
throw new Error(data.error||"Не удалось составить досье. Проверь настройки сервера.");
}

if(!data.fields||typeof data.fields!=="object"){
throw new Error("Сервер не вернул поля анкеты. Проверь версию api/dossier.js.");
}

currentDossierDraft=data;
currentDossierIndex=index;

status.textContent="Готово! Проверь найденную информацию, отредактируй черновик и отметь поля, которые хочешь перенести в профиль. ♡";
renderDossierDraft(index);

}catch(error){
if(error.name==="AbortError"){
status.textContent="Поиск занял слишком много времени. Попробуй ещё раз.";
}else{
status.textContent="Не удалось получить досье: "+(error.message||"неизвестная ошибка");
}
}finally{
dossierRequestInProgress=false;
const currentButton=document.getElementById("dossierSearchButton");
if(currentButton){
currentButton.disabled=false;
currentButton.textContent="🔎 Найти информацию и составить досье";
}
}
}

function renderDossierDraft(index){
const data=currentDossierDraft;
if(!data||currentDossierIndex!==index)return;

const area=document.getElementById("dossierDraftArea");
if(!area)return;

const identity=data.identity?dossierText(data.identity):"Не указано";
const uncertainty=data.uncertainty?dossierText(data.uncertainty):"Не указано";
const sources=Array.isArray(data.sources)?data.sources:[];
const fieldSources=data.fieldSources&&typeof data.fieldSources==="object"?data.fieldSources:{};

let html=`
<div class="dossier-meta">
<strong>Проверка личности персонажа</strong>
<div style="margin-top:5px">${escapeHTML(identity)}</div>
</div>
<div class="dossier-meta">
<strong>Неопределённость и спорные сведения</strong>
<div style="margin-top:5px">${escapeHTML(uncertainty)}</div>
</div>
<p class="note">Каждое поле можно отредактировать. Галочки определяют, какие сведения будут перенесены в твою анкету.</p>
`;

dossierFields.forEach(field=>{
const value=dossierText(data.fields?.[field.key]);
const currentValue=dossierProfileCurrentValue(index,field.key);
const alreadyFilled=Boolean(currentValue.trim());
const sourceText=dossierFieldSourceText(fieldSources[field.key]);

html+=`
<div class="dossier-draft">
<h4>${field.title}</h4>
<textarea id="dossier-draft-${field.key}" placeholder="${escapeHTML(field.placeholder)}">${escapeHTML(value)}</textarea>
${sourceText?`<div class="dossier-warning">Источник для этого поля: ${escapeHTML(sourceText)}</div>`:""}
${alreadyFilled?`
<div class="dossier-warning">В твоём профиле это поле уже заполнено. Оно не будет заменено, пока ты сама не отметишь галочку ниже.</div>
<div class="dossier-current"><strong>Сейчас в профиле:</strong>\n${escapeHTML(currentValue.slice(0,700))}${currentValue.length>700?"…":""}</div>
`:""}
<label class="dossier-apply">
<input type="checkbox" id="dossier-apply-${field.key}" ${alreadyFilled?"":"checked"}>
<span>Применить это поле в моём профиле${alreadyFilled?" (заменить существующий текст)":""}</span>
</label>
</div>`;
});

html+=`
<div class="dossier-draft">
<h4>🔗 Источники поиска</h4>
<div class="dossier-sources">
${sources.length?sources.map((source,i)=>dossierSourceLink(source,i)).join(""):"Сервер не вернул отдельный список ссылок."}
</div>
</div>
<div class="dossier-actions">
<button class="primary" onclick="applyCharacterDossier(${index})">💗 Сохранить отмеченные поля</button>
<button class="action" onclick="discardCharacterDossier(${index})">Отменить черновик</button>
</div>
<p class="dossier-warning">Важно: поиск сам по себе ничего не сохраняет. Существующие данные останутся нетронутыми, если ты не отметишь соответствующее поле.</p>
`;

area.innerHTML=html;
}

function applyCharacterDossier(index){
const data=currentDossierDraft;
const character=characters[index];
if(!data||currentDossierIndex!==index||!character){
showToast("Сначала составь черновик досье.");
return;
}

const selected=dossierFields.filter(field=>{
return document.getElementById("dossier-apply-"+field.key)?.checked;
});

if(!selected.length){
showToast("Ты не отметила ни одного поля для сохранения.");
return;
}

const profile=getCharacterProfile(character);

/* Сначала сохраняем актуальные ручные изменения из открытой анкеты. */
dossierFields.forEach(field=>{
const input=document.getElementById("profile-"+field.key);
if(input)profile[field.key]=input.value;
});

/* Переносим только явно отмеченные поля. */
let applied=0;
selected.forEach(field=>{
const draftInput=document.getElementById("dossier-draft-"+field.key);
if(!draftInput)return;
profile[field.key]=draftInput.value.trim();
applied++;
});

if(!applied){
showToast("Не удалось прочитать отмеченные поля.");
return;
}

try{
saveCharacterProfiles();
currentDossierDraft=null;
currentDossierIndex=null;
openCharacterProfile(index);
showToast("Сохранено полей: "+applied+" ♡");
}catch(error){
showToast("Не удалось сохранить. Возможно, закончилось место в памяти браузера.");
}
}

function discardCharacterDossier(index){
if(currentDossierIndex!==index)return;
if(!confirm("Отменить черновик? Он ещё не сохранён в профиль."))return;
currentDossierDraft=null;
currentDossierIndex=null;
const area=document.getElementById("dossierDraftArea");
const status=document.getElementById("dossierStatus");
if(area)area.innerHTML="";
if(status)status.textContent="Черновик отменён. Твоя анкета не изменилась.";
}

/* ===== КОНЕЦ ===== */
</script>
</body>
