
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8dce8">
<title>Roleplay Club</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5dce8;color:#493744}
button{font:inherit;border:0;cursor:pointer}
.phone{min-height:100vh;max-width:480px;margin:auto;background:linear-gradient(145deg,#fce8f0,#e9c9dc);position:relative;overflow:hidden}
.status{height:35px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.screen{padding:24px 22px 35px;min-height:calc(100vh - 35px)}
.lock{min-height:calc(100vh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#fff5fa,#e9c4d8 75%)}
.lock .date{font-size:17px;color:#805b73}
.clock{font-size:76px;font-weight:200;letter-spacing:-4px;margin:5px 0 30px}
.lock h1{font-size:27px;font-weight:600}
.lock p{color:#805b73}
.unlock{background:#fff7fb;color:#895b78;border-radius:30px;padding:14px 28px;margin-top:45px;box-shadow:0 5px 18px #b7839d44}
.home{display:none}
.greeting{font-size:25px;font-weight:650;margin:18px 0 5px}
.subtitle{color:#926e83;font-size:13px;margin-bottom:25px}
.widget{background:#ffffffa8;border:1px solid #fff9;border-radius:22px;padding:17px;margin-bottom:25px;box-shadow:0 8px 25px #b7839d20}
.widget strong{font-size:14px}
.widget p{font-size:13px;color:#88677c;margin:7px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:23px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;color:#513e4c;font-size:11px}
.app-icon{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#fff,#f4d3e3);display:grid;place-items:center;font-size:27px;box-shadow:0 5px 13px #9d6d8933}
.dock{position:sticky;bottom:14px;margin:35px 0 0;padding:13px;background:#ffffff80;border:1px solid #fff9;border-radius:25px;display:flex;justify-content:space-around;backdrop-filter:blur(15px)}
.dock button{background:none;font-size:27px}
.panel{display:none;position:absolute;inset:35px 0 0;background:#fff8fc;padding:22px;overflow:auto;border-radius:25px 25px 0 0}
.panel h2{margin:8px 0 20px}
.back{background:#f3dce8;color:#805b73;padding:9px 15px;border-radius:20px;margin-bottom:15px}
.item{padding:15px;background:#fff;border-radius:17px;margin:10px 0;box-shadow:0 3px 12px #9d6d8910}
.item small{display:block;color:#997b8d;margin-top:5px}
.chat{display:flex;gap:10px;align-items:center}
.avatar{width:43px;height:43px;border-radius:50%;background:#f4d9e7;display:grid;place-items:center;font-size:21px}
.note{font-size:13px;color:#96778a;line-height:1.5}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>9:41</span><span>●●●  Wi-Fi  ▰</span></div>

<section class="screen lock" id="lock">
<div class="date" id="date"></div>
<div class="clock" id="clock">09:41</div>
<h1>Roleplay Club</h1>
<p>Твой маленький виртуальный мир ♡</p>
<button class="unlock" onclick="unlock()">Разблокировать →</button>
</section>

<section class="screen home" id="home">
<div class="greeting">Привет, дорогая ♡</div>
<div class="subtitle">Добро пожаловать в твой мир</div>
<div class="widget">
<strong>✧ ТВОЁ ПРОСТРАНСТВО</strong>
<p>Здесь начинаются истории, знакомства и приключения.</p>
</div>
<div class="grid">
<button class="app" onclick="openApp('chats')"><span class="app-icon">💬</span>Сообщения</button>
<button class="app" onclick="openApp('characters')"><span class="app-icon">🎭</span>Персонажи</button>
<button class="app" onclick="openApp('social')"><span class="app-icon">📸</span>Pinkstagram</button>
<button class="app" onclick="openApp('gallery')"><span class="app-icon">🌷</span>Галерея</button>
<button class="app" onclick="openApp('music')"><span class="app-icon">🎧</span>Melody</button>
<button class="app" onclick="openApp('diary')"><span class="app-icon">📔</span>Дневник</button>
<button class="app" onclick="openApp('contacts')"><span class="app-icon">👥</span>Контакты</button>
<button class="app" onclick="openApp('settings')"><span class="app-icon">⚙️</span>Настройки</button>
</div>
<div class="dock">
<button onclick="openApp('chats')">💬</button>
<button onclick="openApp('social')">📸</button>
<button onclick="openApp('gallery')">🖼️</button>
<button onclick="openApp('settings')">⚙️</button>
</div>
</section>

<section class="panel" id="panel">
<button class="back" onclick="closeApp()">← На главный экран</button>
<div id="panelContent"></div>
</section>
</div>

<script>
const characters=[
["Натаниэль Говард","Тени Сентфора 2","🖤"],
["Надин","Тени Сентфора 2","🌹"],
["Декс","Тени Сентфора 2","⭐"],
["Руди","Тени Сентфора 2","🌙"],
["BB","Big Bad Dogs","🐾"]
];
function updateTime(){
const now=new Date();
document.getElementById('clock').textContent=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
document.getElementById('date').textContent=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
updateTime();setInterval(updateTime,10000);
function unlock(){
document.getElementById('lock').style.display='none';
document.getElementById('home').style.display='block';
}
function closeApp(){
  document.getElementById("panel").style.display = "none";
}

let chatCharacter = null;
let chatHistories = {};

try {
  chatHistories = JSON.parse(localStorage.getItem("roleplay_chats") || "{}");
} catch (e) {
  chatHistories = {};
}

function saveChats() {
  localStorage.setItem("roleplay_chats", JSON.stringify(chatHistories));
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function openApp(name) {
  const content = document.getElementById("panelContent");
  const panel = document.getElementById("panel");

  const titles = {
    chats: "Сообщения 💬",
    characters: "Персонажи 🎭",
    social: "Pinkstagram 📸",
    gallery: "Галерея 🌷",
    music: "Melody 🎧",
    diary: "Дневник 📔",
    contacts: "Контакты 👥",
    settings: "Настройки ⚙️"
  };

  let html = '<h2>' + titles[name] + '</h2>';

  if (name === "characters" || name === "chats") {
    html += '<p class="note">Выбери персонажа, чтобы начать историю ♡</p>';

    characters.forEach((c, i) => {
      html += `
        <button class="item chat" style="width:100%;text-align:left;border:0;cursor:pointer"
          onclick="startChat(${i})">
          <div class="avatar">${c[2]}</div>
          <div>
            <strong>${escapeHTML(c[0])}</strong>
            <small>${escapeHTML(c[1])}</small>
          </div>
        </button>`;
    });
  } else {
    html += '<div class="item"><strong>Скоро здесь появится больше возможностей ♡</strong><p class="note">Мы постепенно создаём это приложение.</p></div>';
  }

  content.innerHTML = html;
  panel.style.display = "block";
}

function startChat(index) {
  chatCharacter = characters[index];

  if (!chatHistories[chatCharacter[0]]) {
    chatHistories[chatCharacter[0]] = [];
  }

  renderChat();
}

function renderChat() {
  const content = document.getElementById("panelContent");
  const history = chatHistories[chatCharacter[0]] || [];

  let html = `
    <button class="back" onclick="openApp('characters')">← К персонажам</button>
    <h2>${escapeHTML(chatCharacter[0])} ${chatCharacter[2]}</h2>
    <p class="note">${escapeHTML(chatCharacter[1])}</p>
    <div id="chatMessages" style="display:flex;flex-direction:column;gap:12px;margin:20px 0">
  `;

  history.forEach(message => {
    const mine = message.role === "user";
    html += `
      <div style="
        align-self:${mine ? "flex-end" : "flex-start"};
        background:${mine ? "#f2d5e3" : "#fff"};
        border-radius:18px;padding:12px 15px;
        max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere">
        ${escapeHTML(message.content)}
      </div>`;
  });

  html += `
    </div>
    <form onsubmit="sendChat(event)" style="display:flex;gap:8px;position:sticky;bottom:0;background:#fff8fc;padding:10px 0">
      <input id="chatInput" placeholder="Напиши сообщение..." autocomplete="off"
        style="min-width:0;flex:1;border:1px solid #e6c5d7;border-radius:22px;padding:13px">
      <button type="submit" id="sendButton"
        style="background:#e9c4d8;color:#583b4e;border-radius:22px;padding:0 17px">➤</button>
    </form>
    <p class="note" id="chatStatus"></p>
  `;

  content.innerHTML = html;
  const box = document.getElementById("panel");
  box.scrollTop = box.scrollHeight;
}

async function sendChat(event) {
  event.preventDefault();

  const input = document.getElementById("chatInput");
  const button = document.getElementById("sendButton");
  const status = document.getElementById("chatStatus");
  const message = input.value.trim();

  if (!message || !chatCharacter) return;

  const history = chatHistories[chatCharacter[0]];
  history.push({ role: "user", content: message });

  saveChats();
  renderChat();

  const send = document.getElementById("sendButton");
  const field = document.getElementById("chatInput");
  send.disabled = true;
  field.disabled = true;

  document.getElementById("chatStatus").textContent = "Персонаж печатает... 💭";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        character: chatCharacter[0],
        messages: history.slice(-30)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера");
    }

    history.push({ role: "assistant", content: data.reply });
    saveChats();
    renderChat();

  } catch (error) {
    history.pop();
    saveChats();
    renderChat();
    document.getElementById("chatStatus").textContent =
      "Не удалось получить ответ: " + error.message;
  }
}

</script>
</body>
</html>
